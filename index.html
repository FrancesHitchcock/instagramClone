<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@400;700&display=swap" rel="stylesheet">
    <title>Instagram Clone</title>
</head>
<body>
    <header>
        <h1>
             <img id="logo" src="images/logo.png" alt="Oldagram.">
        </h1>
    </header>

    <main id="main">
        <section class="user-profile">
            <div class="user-info">
                <img class="avatar" src="images/avatar-vangogh.jpg" alt="Van Gogh avatar">
                <div class="user-name-wrapper">
                    <h2 class="name">Vincent van Gogh</h2>
                    <p class="location">Zundert, Netherlands</p>
                </div>
            </div>
            <img class="user-img" src="images/post-vangogh.jpg" alt="Self-portrait of Vincent van Gogh frowning.">
            <div class="profile-section">
                <div class="icon-container">
                    <img class="icon" src="images/icon-heart.png" alt="likes icon.">
                    <img class="icon" src="images/icon-comment.png" alt="comment icon.">
                    <img class="icon" src="images/icon-dm.png" alt="direct message icon.">
                </div>
                <p class="like-count"><span class="bold-text">21,492 likes</span></p>
                <p class="username-caption"><span class="bold-text">vincey1853</span> just took a few mushrooms lol</p>
            </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
